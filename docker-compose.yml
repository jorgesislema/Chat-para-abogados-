# LegalRAG en local: UNA pagina profesional en http://localhost:8000
# (API + interfaz web servidas por FastAPI). Un solo servicio, un solo URL.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: legalrag-backend:latest
    container_name: legalrag-backend
    restart: unless-stopped
    ports:
      # Puerto host configurable (otra app puede ocupar el 8000):
      #   PUERTO_HOST=8081 docker compose up -d
      - "${PUERTO_HOST:-8000}:8000"
    env_file:
      - .env
    environment:
      CADENA_BD: "sqlite:////app/backend/db/legalrag.db"
      RUTA_CHROMADB: "/app/backend/db/chroma_data"
      PYTHONPATH: "/app"
      # Siembra la demo (bufete, usuarios, casos, conversaciones) en el
      # primer arranque. Idempotente: si ya existe, no hace nada.
      AUTO_SEMBRAR_DEMO: "1"
    volumes:
      - ./backend/db:/app/backend/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - legalrag-net

networks:
  legalrag-net:
    name: legalrag-net
    driver: bridge
