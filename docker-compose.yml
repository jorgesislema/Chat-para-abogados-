services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: legalrag-backend:latest
    container_name: legalrag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CADENA_BD: "sqlite:////app/backend/db/legalrag.db"
      RUTA_CHROMADB: "/app/backend/db/chroma_data"
      PYTHONPATH: "/app"
    volumes:
      - ./backend/db:/app/backend/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - legalrag-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: legalrag-frontend:latest
    container_name: legalrag-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      URL_API_BACKEND: "http://backend:8000"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - legalrag-net

networks:
  legalrag-net:
    name: legalrag-net
    driver: bridge
